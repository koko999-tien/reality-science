[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reality-science-worker"
version = "0.1.0"
description = "Isolated Celery compute worker executing verified mathematical ASTs with zero database access"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.3.6,<6.0.0",
    "redis>=5.0.4,<6.0.0",
    "sympy>=1.12.0,<2.0.0",
    "pint>=0.23,<1.0.0",
    "numpy>=1.26,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
