# =============================================================================
# REALITY SCIENCE — Hardened Redis Configuration
# Conduits Zone 2 (Data Core) and Zone 3 (Compute Sandbox)
# =============================================================================

bind 0.0.0.0
port 6379
requirepass redis_secret_pw
maxmemory 512mb
maxmemory-policy volatile-lru

# Disable dangerous administrative commands from compute worker zone
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command EVAL ""
rename-command EVALSHA ""

tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16
